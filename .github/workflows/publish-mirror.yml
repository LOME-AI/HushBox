name: Publish mirror

# Staging → public. Publication runs on a pinned schedule so the public
# repository's event stream discloses when the schedule fired and nothing about
# when anyone worked; UTC is pinned deliberately, because a zone that observes
# daylight saving would move the firing twice a year and leak which zone it is.
#
# Staging only. A scheduled workflow fires in every repository that carries the
# file, so the repository guard is the only thing stopping the public copy. With
# the repository variables unset the guard stops the job in both repositories.
#
# The suite gate, the fast-forward refusal and the choice of commit all live in
# the script; see docs/PUBLICATION.md for the topology and its runbook.

on:
  schedule:
    # Daily at midnight. GitHub evaluates cron in UTC.
    - cron: '0 0 * * *'
  workflow_dispatch:

# The bot authenticates as its own GitHub App, so the workflow token needs
# nothing beyond reading this checkout.
permissions:
  contents: read

# One publication at a time; a dispatch while the scheduled run is in flight
# waits rather than racing it onto the same branch.
concurrency:
  group: publish-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == vars.HB_STAGING_REPO
    steps:
      # ref: main — the destination is pinned to `main`, so the source is too. A
      # dispatch takes a caller-chosen branch, and publishing that branch's tip
      # onto public would publish unmerged work irreversibly.
      # fetch-depth: 0 — the mirror walks back through staging's history for
      # the newest commit with a green suite, and asks git whether public's head
      # is an ancestor of it. A shallow clone can answer neither.
      # persist-credentials: false — a persisted workflow token is sent as an
      # `Authorization` header that takes precedence over the App token in the
      # mirror's push URL, and this workflow's token may only read staging.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Publish the newest green staging commit to public main
        run: pnpm tsx scripts/publication/publish-mirror.ts
        env:
          HUSHBOX_SYNC_APP_ID: ${{ secrets.HUSHBOX_SYNC_APP_ID }}
          HUSHBOX_SYNC_PRIVATE_KEY: ${{ secrets.HUSHBOX_SYNC_PRIVATE_KEY }}
