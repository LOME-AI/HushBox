name: Escrow secrets

# Writes the offline copy of every secret whose loss class says one must exist,
# encrypted to recipients whose private identities live only outside this
# system, and uploaded once to the escrow bucket. The deploy job depends on this
# one, so no deploy publishes a secret set that has no copy behind it.
#
# One job per GitHub environment, because a job declares one environment and
# reads that environment's secrets and the repository's alike, so a value held
# on any other environment resolves to the empty string. Each job binds its
# environment's whole set and refuses the run if any bound value is empty, so a
# set is escrowed entire or not at all. Earlier drafts spread the step across
# the jobs that each already hold a subset; a job whose only purpose is these
# secrets binds all of them without widening any other job's exposure.
#
# The caller names one environment and only that job runs. `needs` cannot name a
# job inside a called workflow, and a called workflow reports the aggregate of
# its jobs, so a caller that wants to wait on one set has no other way to say
# so: the deploy publishes the production secrets and must not be held by a set
# whose keys it never touches.
#
# The dispatch trigger is what closes the rotation lag: a freshly minted key can
# be escrowed on its own, before the job that consumes it runs.
#
# One generated section per job, not to be edited by hand: the step's secret
# bindings, from `pnpm generate:env` (scripts/generate-env.ts), which derives
# them from each credential's declared loss class and the job that can bind its
# store. CI re-runs that generator and diffs the result, so a binding out of
# step with the declarations fails the build.
#
# Every job's section carries the escrow bucket, its endpoint and its key pair,
# all four held at repository level rather than on one environment: every job
# writes to the same bucket, and an environment-held value resolves to the empty
# string in every other environment. The bucket and its endpoint grant nothing
# and are secrets anyway, because holding them outside the repository is what
# keeps any file here from naming where the copies are kept.

on:
  workflow_call:
    inputs:
      environment:
        description: "Which environment's set to write."
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment's set to write."
        type: choice
        required: true
        options:
          - production
          - backup

permissions:
  contents: read

jobs:
  escrow:
    # GitHub-hosted for the reason the deploy job is: this binds the whole
    # hyper-secret set, so it stays off the third-party runner fleet.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Dispatchable in whichever repository carries the file, and only the public
    # one holds the `production` environment this leans on — so anywhere else
    # every secret bound below would resolve empty and the run would refuse on
    # the whole set at once. The guard says which repository the file belongs to
    # rather than leaving that to be inferred from a refusal.
    if: github.repository == vars.HB_PUBLIC_REPO && inputs.environment == 'production'
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # A script rather than a shell pipeline, so no value is ever substituted
      # into a command line: the run refuses before it encrypts anything when a
      # binding is missing or empty, and every value leaves the environment only
      # as ciphertext.
      - name: Write the escrow copy
        run: pnpm -w exec tsx scripts/escrow-secrets.ts production
        env:
          # BEGIN GENERATED: escrow-secrets-env-production
          ADMIN_ACTOR_ALLOWLIST: ${{ secrets.ADMIN_ACTOR_ALLOWLIST }}
          ADMIN_ROLE_MAP: ${{ secrets.ADMIN_ROLE_MAP }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ENUMERATION_DECOY_SECRET: ${{ secrets.ENUMERATION_DECOY_SECRET }}
          GROWTH_HASH_SECRET: ${{ secrets.GROWTH_HASH_SECRET }}
          HELCIM_WEBHOOK_VERIFIER: ${{ secrets.HELCIM_WEBHOOK_VERIFIER_PRODUCTION }}
          IDEMPOTENCY_BODY_HASH_SECRET: ${{ secrets.IDEMPOTENCY_BODY_HASH_SECRET }}
          IRON_SESSION_SECRET: ${{ secrets.IRON_SESSION_SECRET }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          NOTIFICATION_TAG_SECRET: ${{ secrets.NOTIFICATION_TAG_SECRET }}
          OPAQUE_KEK: ${{ secrets.OPAQUE_KEK }}
          OPAQUE_KEK_NEXT: ${{ secrets.OPAQUE_KEK_NEXT }}
          RATE_LIMIT_KEY_SECRET: ${{ secrets.RATE_LIMIT_KEY_SECRET }}
          TOTP_ENCRYPTION_SECRET: ${{ secrets.TOTP_ENCRYPTION_SECRET }}
          TOTP_ENCRYPTION_SECRET_NEXT: ${{ secrets.TOTP_ENCRYPTION_SECRET_NEXT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          ESCROW_B2_KEY_ID: ${{ secrets.ESCROW_B2_KEY_ID }}
          ESCROW_B2_APPLICATION_KEY: ${{ secrets.ESCROW_B2_APPLICATION_KEY }}
          ESCROW_B2_BUCKET: ${{ secrets.ESCROW_B2_BUCKET }}
          ESCROW_B2_S3_ENDPOINT: ${{ secrets.ESCROW_B2_S3_ENDPOINT }}
          # END GENERATED: escrow-secrets-env-production

  escrow-backup:
    # The backup repository password lives on the `backup` environment, which the
    # `escrow` job cannot read: an environment secret resolves to the empty
    # string anywhere else, and the whole-set refusal is what would fire. So the
    # set gets a job under its own environment rather than a binding that
    # silently escrows nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == vars.HB_PUBLIC_REPO && inputs.environment == 'backup'
    environment: backup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Write the escrow copy
        run: pnpm -w exec tsx scripts/escrow-secrets.ts backup
        env:
          # BEGIN GENERATED: escrow-secrets-env-backup
          BACKUP_REPOSITORY_PASSWORD: ${{ secrets.BACKUP_REPOSITORY_PASSWORD }}
          ESCROW_B2_KEY_ID: ${{ secrets.ESCROW_B2_KEY_ID }}
          ESCROW_B2_APPLICATION_KEY: ${{ secrets.ESCROW_B2_APPLICATION_KEY }}
          ESCROW_B2_BUCKET: ${{ secrets.ESCROW_B2_BUCKET }}
          ESCROW_B2_S3_ENDPOINT: ${{ secrets.ESCROW_B2_S3_ENDPOINT }}
          # END GENERATED: escrow-secrets-env-backup
