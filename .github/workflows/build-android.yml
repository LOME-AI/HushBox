name: Build Android

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
        description: 'The commit to build: the one the release tag points at, never the dispatched head.'
      version-name:
        required: true
        type: string
      version-code:
        required: true
        type: string
      version:
        required: true
        type: string
      privacy-policy-effective-date:
        required: true
        type: string
        description: 'Derived by the caller from the release tags; never typed by a person.'
      terms-of-service-effective-date:
        required: true
        type: string
        description: 'Derived by the caller from the release tags; never typed by a person.'
      vite-platform:
        required: true
        type: string
        description: 'Vite build platform: "android" for Play-Store-configured build, "android-direct" for Obtainium/direct-install build.'
      output:
        required: true
        type: string
        description: '"apk-github-release" | "aab-play-upload" | "aab-artifact"'
      play-track:
        required: false
        type: string
        default: production
        description: 'Play Store track when output=aab-play-upload. Ignored otherwise.'
      github-release-prerelease:
        required: false
        type: boolean
        default: false
        description: 'Mark the GitHub Release as a pre-release when output=apk-github-release.'
      github-release-title-suffix:
        required: false
        type: string
        default: ''
        description: 'Suffix appended to the GitHub Release title when output=apk-github-release.'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # Every step below is a process of its own, so none of them inherits the
    # mode from the step that generated its env file. This job builds what
    # ships, and production is the one mode that runs no stack: naming it here
    # is what makes each build resolve production instead of refusing for want
    # of a mode.
    env:
      HB_ENV_MODE: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode keystore
        run: echo "$KEYSTORE_B64" | base64 -d > /tmp/hushbox-release.jks
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Verify keystore
        run: |
          echo "Keystore file exists: $(test -s /tmp/hushbox-release.jks && echo YES || echo NO)"
          echo "Store password set: $(test -n "$ANDROID_KEYSTORE_PASSWORD" && echo YES || echo NO)"
          echo "Key alias set: $(test -n "$ANDROID_KEY_ALIAS" && echo YES || echo NO)"
          echo "Key password set: $(test -n "$ANDROID_KEY_PASSWORD" && echo YES || echo NO)"
          if keytool -list -keystore /tmp/hushbox-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null; then
            echo "Store password: CORRECT"
          else
            echo "Store password: WRONG"
            exit 1
          fi
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Decode google-services.json
        # BEGIN GENERATED: decode-google-services
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > apps/web/android/app/google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        # END GENERATED: decode-google-services

      - name: Generate production environment file
        run: pnpm generate:env --mode=production
        # BEGIN GENERATED: production-env-android
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_HELCIM_JS_TOKEN_PRODUCTION: ${{ secrets.VITE_HELCIM_JS_TOKEN_PRODUCTION }}
          VITE_APP_VERSION: ${{ inputs.version }}
          VITE_PRIVACY_POLICY_EFFECTIVE_DATE: ${{ inputs.privacy-policy-effective-date }}
          VITE_TERMS_OF_SERVICE_EFFECTIVE_DATE: ${{ inputs.terms-of-service-effective-date }}
        # END GENERATED: production-env-android

      - name: Verify production environment
        run: pnpm verify:env --mode=production

      - name: Build web for Android
        run: pnpm --filter web build
        # BEGIN GENERATED: build-env-android
        env:
          VITE_SANDBOX_ORIGIN_URL: https://sandbox.hushbox.ai
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_API_URL: https://api.hushbox.ai
          VITE_HELCIM_JS_TOKEN: ${{ secrets.VITE_HELCIM_JS_TOKEN_PRODUCTION }}
          VITE_PLATFORM: ${{ inputs.vite-platform }}
          VITE_APP_VERSION: ${{ inputs.version }}
          VITE_PRIVACY_POLICY_EFFECTIVE_DATE: ${{ inputs.privacy-policy-effective-date }}
          VITE_TERMS_OF_SERVICE_EFFECTIVE_DATE: ${{ inputs.terms-of-service-effective-date }}
          VITE_WEB_URL: https://hushbox.ai
        # END GENERATED: build-env-android

      # `cap sync` copies this dist into the APK, so the bundle guard runs on it
      # between the build and the sync. The step needs no env block.
      #
      # This bundle is compiled into the APK and served there by the web view,
      # which is no HTTP origin: the check is told so, because the output
      # directory it is in cannot say it.
      - name: Verify web bundle
        run: pnpm verify:bundle --not-served-over-http

      - name: Generate platform assets
        working-directory: apps/web
        run: pnpm asset:sync

      - name: Sync Android
        working-directory: apps/web
        run: pnpm cap:sync android

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/web/android

      # ── output=apk-github-release ─────────────────────────
      - name: Build APK
        if: inputs.output == 'apk-github-release'
        working-directory: apps/web/android
        run: bundle exec fastlane build_apk
        env:
          ANDROID_KEYSTORE_PATH: /tmp/hushbox-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version-code }}
          VERSION_NAME: ${{ inputs.version-name }}

      # ── output=aab-* (shared build) ───────────────────────
      - name: Build AAB
        if: inputs.output == 'aab-play-upload' || inputs.output == 'aab-artifact'
        working-directory: apps/web/android
        run: bundle exec fastlane build_aab
        env:
          ANDROID_KEYSTORE_PATH: /tmp/hushbox-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version-code }}
          VERSION_NAME: ${{ inputs.version-name }}

      # ── every output ──────────────────────────────────────
      # The APK or AAB about to leave this job, unpacked and read between its
      # build and its first publish: any production value this job holds, or a
      # credential shape gitleaks reports, fails the build with nothing released.
      - name: Sweep the built app for secrets
        run: pnpm tsx scripts/sweep-shipped-artifacts.ts "$APP_ARCHIVE"
        env:
          APP_ARCHIVE: ${{ inputs.output == 'apk-github-release' && 'apps/web/android/app/build/outputs/apk/release/app-release.apk' || 'apps/web/android/app/build/outputs/bundle/release/app-release.aab' }}
          # BEGIN GENERATED: artifact-sweep-env
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          RATE_LIMIT_KEY_SECRET: ${{ secrets.RATE_LIMIT_KEY_SECRET }}
          IDEMPOTENCY_BODY_HASH_SECRET: ${{ secrets.IDEMPOTENCY_BODY_HASH_SECRET }}
          OPAQUE_KEK: ${{ secrets.OPAQUE_KEK }}
          OPAQUE_KEK_NEXT: ${{ secrets.OPAQUE_KEK_NEXT }}
          TOTP_ENCRYPTION_SECRET: ${{ secrets.TOTP_ENCRYPTION_SECRET }}
          TOTP_ENCRYPTION_SECRET_NEXT: ${{ secrets.TOTP_ENCRYPTION_SECRET_NEXT }}
          ENUMERATION_DECOY_SECRET: ${{ secrets.ENUMERATION_DECOY_SECRET }}
          IRON_SESSION_SECRET: ${{ secrets.IRON_SESSION_SECRET }}
          CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
          ADMIN_ACTOR_ALLOWLIST: ${{ secrets.ADMIN_ACTOR_ALLOWLIST }}
          ADMIN_ROLE_MAP: ${{ secrets.ADMIN_ROLE_MAP }}
          GROWTH_READER_DATABASE_URL: ${{ secrets.GROWTH_READER_DATABASE_URL }}
          ADMIN_SQL_PANEL_DATABASE_URL: ${{ secrets.ADMIN_SQL_PANEL_DATABASE_URL }}
          CLOUDFLARE_ACCESS_LOG_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_LOG_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROWTH_HASH_SECRET: ${{ secrets.GROWTH_HASH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_PRODUCTION }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY_PRODUCTION }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          NOTIFICATION_TAG_SECRET: ${{ secrets.NOTIFICATION_TAG_SECRET }}
          HELCIM_API_TOKEN: ${{ secrets.HELCIM_API_TOKEN_PRODUCTION }}
          LINEAR_API_KEY_READ: ${{ secrets.LINEAR_API_KEY_READ }}
          HELCIM_WEBHOOK_VERIFIER: ${{ secrets.HELCIM_WEBHOOK_VERIFIER_PRODUCTION }}
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BACKUP_B2_S3_ENDPOINT: ${{ secrets.BACKUP_B2_S3_ENDPOINT }}
          BACKUP_B2_REGION: ${{ secrets.BACKUP_B2_REGION }}
          BACKUP_B2_AUDITOR_KEY_ID: ${{ secrets.BACKUP_B2_AUDITOR_KEY_ID }}
          BACKUP_B2_AUDITOR_KEY: ${{ secrets.BACKUP_B2_AUDITOR_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          R2_ADMIN_ACCESS_KEY_ID: ${{ secrets.R2_ADMIN_ACCESS_KEY_ID }}
          R2_ADMIN_SECRET_ACCESS_KEY: ${{ secrets.R2_ADMIN_SECRET_ACCESS_KEY }}
          VITE_HELCIM_JS_TOKEN: ${{ secrets.VITE_HELCIM_JS_TOKEN_PRODUCTION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HUSHBOX_SYNC_PRIVATE_KEY: ${{ secrets.HUSHBOX_SYNC_PRIVATE_KEY }}
          ESCROW_B2_BUCKET: ${{ secrets.ESCROW_B2_BUCKET }}
          ESCROW_B2_S3_ENDPOINT: ${{ secrets.ESCROW_B2_S3_ENDPOINT }}
          ESCROW_B2_KEY_ID: ${{ secrets.ESCROW_B2_KEY_ID }}
          ESCROW_B2_APPLICATION_KEY: ${{ secrets.ESCROW_B2_APPLICATION_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ANDROID_CERT_SHA256_FINGERPRINT: ${{ secrets.ANDROID_CERT_SHA256_FINGERPRINT }}
          # END GENERATED: artifact-sweep-env

      # ── output=apk-github-release ─────────────────────────
      - name: Create GitHub Release
        if: inputs.output == 'apk-github-release'
        # PRERELEASE carries the flag or nothing, so it is the one expansion here
        # that must stay unquoted: quoting an empty value passes `gh` an empty
        # argument instead of no argument.
        run: |
          gh release create "v$VERSION_NAME" \
            apps/web/android/app/build/outputs/apk/release/app-release.apk \
            --title "v$VERSION_NAME$TITLE_SUFFIX" \
            --generate-notes \
            $PRERELEASE
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version-name }}
          TITLE_SUFFIX: ${{ inputs.github-release-title-suffix }}
          PRERELEASE: ${{ inputs.github-release-prerelease && '--prerelease' || '' }}

      # ── output=aab-play-upload ────────────────────────────
      - name: Upload AAB to Play Store
        if: inputs.output == 'aab-play-upload'
        working-directory: apps/web/android
        run: bundle exec fastlane upload_aab track:"$PLAY_TRACK"
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          PLAY_TRACK: ${{ inputs.play-track }}

      # ── output=aab-artifact ───────────────────────────────
      - name: Upload AAB as workflow artifact
        if: inputs.output == 'aab-artifact'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release-aab-v${{ inputs.version-name }}
          path: apps/web/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
