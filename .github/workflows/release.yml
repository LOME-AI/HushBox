name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Deploy target'
        type: choice
        required: true
        options:
          - github
          - play_store
          - apple_store
          - all
      track:
        description: 'Release track (see validation rules)'
        type: choice
        required: true
        options:
          - production
          - internal
          - experimental
          - manual

permissions:
  contents: write

jobs:
  # ── Validate (platform, track) combination ─────────────
  # Valid:
  #   (github, production | internal | experimental)
  #   (play_store | apple_store, production | internal | manual)
  #   (all, production | internal)
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Releases are cut from the public repository alone. Both repositories carry
    # this file, so the guard rather than the file's absence is what stops it.
    if: github.repository == vars.HB_PUBLIC_REPO
    steps:
      - name: Validate input combination
        env:
          PLATFORM: ${{ inputs.platform }}
          TRACK: ${{ inputs.track }}
        run: |
          if [ "$TRACK" = "experimental" ] && [ "$PLATFORM" != "github" ]; then
            echo "::error::track=experimental requires platform=github (got platform=$PLATFORM)"
            exit 1
          fi
          if [ "$TRACK" = "manual" ] && { [ "$PLATFORM" = "github" ] || [ "$PLATFORM" = "all" ]; }; then
            echo "::error::track=manual requires platform=play_store or platform=apple_store (got platform=$PLATFORM)"
            exit 1
          fi
          echo "OK: platform=$PLATFORM, track=$TRACK"

  # ── Version extraction (needed by every downstream job) ─
  prepare-version:
    needs: [validate]
    runs-on: ubuntu-latest
    if: github.repository == vars.HB_PUBLIC_REPO
    timeout-minutes: 3
    # `actions: read` is for the CI gate's read of the tagged commit's runs.
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      version: ${{ steps.version.outputs.version }}
      privacy_policy_effective_date: ${{ steps.legal-dates.outputs.privacy_policy_effective_date }}
      terms_of_service_effective_date: ${{ steps.legal-dates.outputs.terms_of_service_effective_date }}
    steps:
      # Full history with every tag, which the `Get latest version` step needs:
      # it picks the highest `vX.Y.Z` tag in the repository, whichever branch
      # it sits on, not one reachable from the dispatched ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Get latest version
        id: tag
        run: |
          TAG=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$TAG" ]; then
            echo "No version tags found — has ci.yml deployed at least once?"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          COMMIT=$(git rev-list -n 1 "$TAG")
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      # Every value this job hands the native builds comes from the commit they
      # build, so the version and the legal effective dates are read from the
      # tagged commit, never from the dispatched head. Full history with tags
      # again: the dates are the day of the earliest release tag carrying each
      # document's revision, and a clone fetched without tags is
      # indistinguishable from one never tagged, so the derivation would answer
      # today rather than fail.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.commit }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # A store binary cannot be rolled back the way an OTA bundle can, so the
      # native builds start only from a commit CI passed.
      - name: Require a green CI run for the tagged commit
        run: pnpm tsx scripts/release/release-ci-gate.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
      - name: Extract version
        id: version
        run: pnpm tsx scripts/extract-version.ts
        env:
          INPUT_VERSION: ${{ steps.tag.outputs.tag }}

      # The bundles these builds carry render the Privacy Policy's effective
      # date, so they need the same answer the deploy pipeline's own version job
      # derives. Prints its own refusal to this step's log and stops the release.
      - name: Derive the legal effective dates
        id: legal-dates
        run: pnpm tsx scripts/legal-effective-dates.ts

      # Fail fast on a re-run that would re-publish an already-released version.
      # The GitHub-release path (android-github) overwrites an existing release
      # and its assets silently on a re-run of the same tag, so guard it: if a
      # release for this tag already exists, stop and tell the operator to bump
      # (tag a new vX.Y.Z) rather than clobber the published one. Store paths
      # (play_store/apple_store) are gated store-side by versionCode uniqueness,
      # which rejects — never overwrites — a duplicate.
      - name: Guard against re-publishing an existing GitHub release
        if: inputs.platform == 'github' || inputs.platform == 'all'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists — a re-run would overwrite it and its assets. Bump the version (tag a new vX.Y.Z) and re-run."
            exit 1
          fi
          echo "OK: no existing GitHub release for $TAG"

  # ── iOS: TestFlight / App Store submit / IPA artifact ──
  # No web bundle is prepared here: the platform flag is compiled into the
  # JavaScript, so the iOS job builds its own with VITE_PLATFORM=ios rather than
  # inheriting a bundle some other job built for the web.
  ios:
    needs: [prepare-version]
    if: |
      github.repository == vars.HB_PUBLIC_REPO
      && (inputs.platform == 'apple_store' || inputs.platform == 'all')
      && inputs.track != 'experimental'
    uses: ./.github/workflows/build-ios.yml
    with:
      ref: ${{ needs.prepare-version.outputs.commit }}
      version-name: ${{ needs.prepare-version.outputs.version_name }}
      version-code: ${{ needs.prepare-version.outputs.version_code }}
      version: ${{ needs.prepare-version.outputs.version }}
      privacy-policy-effective-date: ${{ needs.prepare-version.outputs.privacy_policy_effective_date }}
      terms-of-service-effective-date: ${{ needs.prepare-version.outputs.terms_of_service_effective_date }}
      output: ${{ inputs.track == 'production' && 'app-store-submit' || inputs.track == 'manual' && 'ipa-artifact' || 'testflight' }}
    secrets: inherit

  # ── Android Play Store: AAB → track or artifact ────────
  android-play:
    needs: [prepare-version]
    if: |
      github.repository == vars.HB_PUBLIC_REPO
      && (inputs.platform == 'play_store' || inputs.platform == 'all')
      && inputs.track != 'experimental'
    uses: ./.github/workflows/build-android.yml
    with:
      ref: ${{ needs.prepare-version.outputs.commit }}
      version-name: ${{ needs.prepare-version.outputs.version_name }}
      version-code: ${{ needs.prepare-version.outputs.version_code }}
      version: ${{ needs.prepare-version.outputs.version }}
      privacy-policy-effective-date: ${{ needs.prepare-version.outputs.privacy_policy_effective_date }}
      terms-of-service-effective-date: ${{ needs.prepare-version.outputs.terms_of_service_effective_date }}
      vite-platform: android
      output: ${{ inputs.track == 'manual' && 'aab-artifact' || 'aab-play-upload' }}
      play-track: ${{ inputs.track == 'production' && 'production' || 'internal' }}
    secrets: inherit

  # ── Android GitHub: APK + Release (production/internal/experimental) ─
  android-github:
    needs: [prepare-version]
    if: github.repository == vars.HB_PUBLIC_REPO && (inputs.platform == 'github' || inputs.platform == 'all')
    uses: ./.github/workflows/build-android.yml
    with:
      ref: ${{ needs.prepare-version.outputs.commit }}
      version-name: ${{ needs.prepare-version.outputs.version_name }}
      version-code: ${{ needs.prepare-version.outputs.version_code }}
      version: ${{ needs.prepare-version.outputs.version }}
      privacy-policy-effective-date: ${{ needs.prepare-version.outputs.privacy_policy_effective_date }}
      terms-of-service-effective-date: ${{ needs.prepare-version.outputs.terms_of_service_effective_date }}
      vite-platform: ${{ inputs.track == 'internal' && 'android' || 'android-direct' }}
      output: apk-github-release
      github-release-prerelease: ${{ inputs.track != 'production' }}
      github-release-title-suffix: ${{ inputs.track == 'internal' && ' (Internal)' || inputs.track == 'experimental' && ' (Experimental)' || '' }}
    secrets: inherit
