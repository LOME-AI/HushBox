name: Build iOS

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
        description: 'The commit to build: the one the release tag points at, never the dispatched head.'
      version-name:
        required: true
        type: string
      version-code:
        required: true
        type: string
      version:
        required: true
        type: string
      privacy-policy-effective-date:
        required: true
        type: string
        description: 'Derived by the caller from the release tags; never typed by a person.'
      terms-of-service-effective-date:
        required: true
        type: string
        description: 'Derived by the caller from the release tags; never typed by a person.'
      output:
        required: true
        type: string
        description: '"testflight" | "app-store-submit" | "ipa-artifact"'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    environment: production
    # Every step below is a process of its own, so none of them inherits the
    # mode from the step that generated its env file. This job builds what
    # ships, and production is the one mode that runs no stack: naming it here
    # is what makes each build resolve production instead of refusing for want
    # of a mode.
    env:
      HB_ENV_MODE: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup

      - name: Generate production environment file
        run: pnpm generate:env --mode=production
        # BEGIN GENERATED: production-env-ios
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_HELCIM_JS_TOKEN_PRODUCTION: ${{ secrets.VITE_HELCIM_JS_TOKEN_PRODUCTION }}
          VITE_APP_VERSION: ${{ inputs.version }}
          VITE_PRIVACY_POLICY_EFFECTIVE_DATE: ${{ inputs.privacy-policy-effective-date }}
          VITE_TERMS_OF_SERVICE_EFFECTIVE_DATE: ${{ inputs.terms-of-service-effective-date }}
        # END GENERATED: production-env-ios

      - name: Verify production environment
        run: pnpm verify:env --mode=production

      - name: Build web for iOS
        run: pnpm --filter web build
        # BEGIN GENERATED: build-env-ios
        env:
          VITE_SANDBOX_ORIGIN_URL: https://sandbox.hushbox.ai
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_API_URL: https://api.hushbox.ai
          VITE_HELCIM_JS_TOKEN: ${{ secrets.VITE_HELCIM_JS_TOKEN_PRODUCTION }}
          VITE_PLATFORM: ios
          VITE_APP_VERSION: ${{ inputs.version }}
          VITE_PRIVACY_POLICY_EFFECTIVE_DATE: ${{ inputs.privacy-policy-effective-date }}
          VITE_TERMS_OF_SERVICE_EFFECTIVE_DATE: ${{ inputs.terms-of-service-effective-date }}
          VITE_WEB_URL: https://hushbox.ai
        # END GENERATED: build-env-ios

      # `cap sync` copies this dist into the Xcode project, so the bundle guard
      # runs on the build above. The step needs no env block.
      #
      # This bundle is compiled into the application binary and served there by
      # the web view, which is no HTTP origin: the check is told so, because the
      # output directory it is in cannot say it.
      - name: Verify web bundle
        run: pnpm verify:bundle --not-served-over-http

      # The platform flag is compiled into the JavaScript and is invisible in the
      # archive afterwards: a web-flagged bundle inside an IPA leaves `isNative()`
      # false, so the splash screen is never dismissed and the app shows nothing
      # else, permanently. The first check is what keeps the second honest — a
      # bundle carrying no stamp at all would otherwise pass it by saying nothing.
      - name: Assert the bundle carries a native platform flag
        working-directory: apps/web
        run: |
          set -euo pipefail
          # Whether the key is quoted and which delimiter carries the value are
          # the printer's choice, not the stamp's: the minified build emits
          # VITE_PLATFORM:`ios` while an unminified one emits "VITE_PLATFORM":
          # "ios". Requiring a delimited value is what keeps the bundle's own
          # `frontendEnvSchema` field and its member accesses, which carry the
          # same key and no stamp, from satisfying the first check.
          q="[\"'\`]"
          stamp="${q}?VITE_PLATFORM${q}?[[:space:]]*:[[:space:]]*${q}"
          if ! grep -rlE "${stamp}[a-z-]+${q}" dist >/dev/null; then
            echo "::error::the built bundle carries no VITE_PLATFORM stamp, so this check can no longer tell an iOS build from a web one"
            exit 1
          fi
          if grep -rlE "${stamp}web${q}" dist >/dev/null; then
            echo "::error::the bundle about to be synced into the Xcode project was built for the web platform; an iOS archive built from it never leaves its splash screen"
            exit 1
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/web/ios

      - name: Generate platform assets
        working-directory: apps/web
        run: pnpm asset:sync

      - name: Sync iOS
        working-directory: apps/web
        run: pnpm cap:sync ios

      - name: Set iOS version
        working-directory: apps/web/ios/App
        run: |
          agvtool new-marketing-version "$VERSION_NAME"
          agvtool new-version -all "$VERSION_CODE"
        env:
          VERSION_NAME: ${{ inputs.version-name }}
          VERSION_CODE: ${{ inputs.version-code }}

      # Every output builds the same IPA; publishing it is a separate step, so
      # the sweep below reads what is about to leave the job.
      - name: Build IPA
        working-directory: apps/web/ios
        run: bundle exec fastlane build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

      # The IPA, unpacked and read between its build and its first publish: any
      # production value this job holds, or a credential shape gitleaks reports,
      # fails the build with nothing uploaded.
      - name: Sweep the built app for secrets
        run: pnpm tsx scripts/sweep-shipped-artifacts.ts apps/web/ios/build/HushBox.ipa
        env:
          # BEGIN GENERATED: artifact-sweep-env
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          RATE_LIMIT_KEY_SECRET: ${{ secrets.RATE_LIMIT_KEY_SECRET }}
          IDEMPOTENCY_BODY_HASH_SECRET: ${{ secrets.IDEMPOTENCY_BODY_HASH_SECRET }}
          OPAQUE_KEK: ${{ secrets.OPAQUE_KEK }}
          OPAQUE_KEK_NEXT: ${{ secrets.OPAQUE_KEK_NEXT }}
          TOTP_ENCRYPTION_SECRET: ${{ secrets.TOTP_ENCRYPTION_SECRET }}
          TOTP_ENCRYPTION_SECRET_NEXT: ${{ secrets.TOTP_ENCRYPTION_SECRET_NEXT }}
          ENUMERATION_DECOY_SECRET: ${{ secrets.ENUMERATION_DECOY_SECRET }}
          IRON_SESSION_SECRET: ${{ secrets.IRON_SESSION_SECRET }}
          CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
          ADMIN_ACTOR_ALLOWLIST: ${{ secrets.ADMIN_ACTOR_ALLOWLIST }}
          ADMIN_ROLE_MAP: ${{ secrets.ADMIN_ROLE_MAP }}
          GROWTH_READER_DATABASE_URL: ${{ secrets.GROWTH_READER_DATABASE_URL }}
          ADMIN_SQL_PANEL_DATABASE_URL: ${{ secrets.ADMIN_SQL_PANEL_DATABASE_URL }}
          CLOUDFLARE_ACCESS_LOG_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_LOG_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROWTH_HASH_SECRET: ${{ secrets.GROWTH_HASH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_PRODUCTION }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY_PRODUCTION }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          NOTIFICATION_TAG_SECRET: ${{ secrets.NOTIFICATION_TAG_SECRET }}
          HELCIM_API_TOKEN: ${{ secrets.HELCIM_API_TOKEN_PRODUCTION }}
          LINEAR_API_KEY_READ: ${{ secrets.LINEAR_API_KEY_READ }}
          HELCIM_WEBHOOK_VERIFIER: ${{ secrets.HELCIM_WEBHOOK_VERIFIER_PRODUCTION }}
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BACKUP_B2_S3_ENDPOINT: ${{ secrets.BACKUP_B2_S3_ENDPOINT }}
          BACKUP_B2_REGION: ${{ secrets.BACKUP_B2_REGION }}
          BACKUP_B2_AUDITOR_KEY_ID: ${{ secrets.BACKUP_B2_AUDITOR_KEY_ID }}
          BACKUP_B2_AUDITOR_KEY: ${{ secrets.BACKUP_B2_AUDITOR_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          R2_ADMIN_ACCESS_KEY_ID: ${{ secrets.R2_ADMIN_ACCESS_KEY_ID }}
          R2_ADMIN_SECRET_ACCESS_KEY: ${{ secrets.R2_ADMIN_SECRET_ACCESS_KEY }}
          VITE_HELCIM_JS_TOKEN: ${{ secrets.VITE_HELCIM_JS_TOKEN_PRODUCTION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HUSHBOX_SYNC_PRIVATE_KEY: ${{ secrets.HUSHBOX_SYNC_PRIVATE_KEY }}
          ESCROW_B2_BUCKET: ${{ secrets.ESCROW_B2_BUCKET }}
          ESCROW_B2_S3_ENDPOINT: ${{ secrets.ESCROW_B2_S3_ENDPOINT }}
          ESCROW_B2_KEY_ID: ${{ secrets.ESCROW_B2_KEY_ID }}
          ESCROW_B2_APPLICATION_KEY: ${{ secrets.ESCROW_B2_APPLICATION_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ANDROID_CERT_SHA256_FINGERPRINT: ${{ secrets.ANDROID_CERT_SHA256_FINGERPRINT }}
          # END GENERATED: artifact-sweep-env

      # ── output=ipa-artifact ───────────────────────────────
      - name: Upload IPA as workflow artifact
        if: inputs.output == 'ipa-artifact'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: HushBox-ipa-v${{ inputs.version-name }}
          path: apps/web/ios/build/HushBox.ipa
          if-no-files-found: error

      # ── output=testflight | app-store-submit ──────────────
      - name: Upload to App Store Connect
        if: inputs.output == 'testflight' || inputs.output == 'app-store-submit'
        working-directory: apps/web/ios
        run: bundle exec fastlane upload submit_for_review:"$SUBMIT_FOR_REVIEW"
        env:
          SUBMIT_FOR_REVIEW: ${{ inputs.output == 'app-store-submit' }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
